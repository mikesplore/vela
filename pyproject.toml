[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mikesplore-vela"
version = "1.0.0"
description = "Vela — Linux remote-PC agent with LLM assistant"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["remote-control", "agent", "pc-control", "linux", "assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.23.0",
    "python-jose[cryptography]>=3.4.0",
    "bcrypt>=4.0.0",
    "PyYAML>=6.0",
    "psutil>=5.9.0",
    "Pillow>=10.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=1.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.6",
    "APScheduler>=3.11.0",
    "SQLAlchemy>=2.0.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0",
    "websockets",
    "requests",
    "starlette",
    "resend",
    "typing-extensions",
    "spotipy>=2.24.0",
    "speedtest-cli>=2.1.3",
    "notify2",
]

[project.urls]
Homepage = "https://github.com/mikesplore/vela"
Repository = "https://github.com/mikesplore/vela"
Documentation = "https://github.com/mikesplore/vela"

[project.scripts]
vela = "app.cli:main"
vela-agent = "app.agent.agent:main"
vela-init = "installer:main"

[tool.setuptools]
py-modules = ["installer"]

[tool.setuptools.packages.find]
include = ["app*"]
